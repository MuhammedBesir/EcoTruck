services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecotrack
      POSTGRES_USER: ecotrack_user
      POSTGRES_PASSWORD: ecotrack_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrack_user -d ecotrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://ecotrack_user:ecotrack_pass@db:5432/ecotrack
      NODE_ENV: development
      PORT: 3001
      CLIENT_URL: http://10.66.234.122:5173
      JWT_SECRET: ecotrack_jwt_secret_change_in_production_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://10.66.234.122:3001
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
